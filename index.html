        <h1>SaveItForL8R — AI Note Taking &amp; Personal Second Brain</h1>
        <p>SaveItForL8R is a free, AI-powered note taking app that uses <strong>Google Gemini</strong> to automatically enrich, tag, and organize your notes, images, and files.</p>
        <h2>Features</h2>
        <ul>
          <li><strong>AI-Powered Enrichment</strong> — Google Gemini analyzes your notes and adds context, tags, and summaries automatically.</li>
          <li><strong>Smart Search</strong> — Ask questions in natural language and find exactly what you saved.</li>
          <li><strong>Encrypted Storage</strong> — All your memories are encrypted with AES-256 before being stored.</li>
          <li><strong>Google Drive Sync</strong> — Optionally back up your encrypted data to Google Drive.</li>
          <li><strong>Installable PWA</strong> — Install as a native-like app on any device with offline support.</li>
          <li><strong>Image &amp; File Support</strong> — Save photos, PDFs, text files, and more alongside your notes.</li>
        </ul>
        <p>Please enable JavaScript to use SaveItForL8R.</p>

    <script>
       // Stuck-state detection: if React hasn't mounted within 5s, the JS bundles
       // likely failed to load (offline/lie-fi). Show an offline message so the
       // user knows the app is alive and can retry or wait for network recovery.
       // Skipped on native platforms where assets load from local filesystem.
       (function() {
         if (window.Capacitor && window.Capacitor.isNativePlatform()) return;
         var STUCK_TIMEOUT = 5000;
         var timer = setTimeout(function() {
           var root = document.getElementById('root');
           // React replaces the splash-container children on mount.
           // If splash-logo still exists, React hasn't mounted yet.
           if (root && root.querySelector('.splash-logo')) {
             var msg = document.createElement('div');
             msg.className = 'splash-offline-msg';
             msg.innerHTML = '<p>Waiting for network\u2026</p>'
               + '<p class="splash-offline-subtext">The app will load automatically when connection improves</p>'
               + '<button onclick="location.reload()" class="splash-retry-btn">Retry Now</button>';
             root.appendChild(msg);
           }
         }, STUCK_TIMEOUT);
         // Cancel timer once React mounts (it removes .splash-logo)
         var obs = new MutationObserver(function() {
           if (!document.querySelector('.splash-logo')) {
             clearTimeout(timer);
             obs.disconnect();
           }
         });
         obs.observe(document.getElementById('root'), { childList: true, subtree: true });
       })();
    </script>
    <script>
       if ('serviceWorker' in navigator) {
         window.addEventListener('load', () => {
           // Skip service worker on native platforms (Capacitor).
           // Capacitor serves assets locally via its own WebViewClient;
           // the SW's network-first navigation strategy conflicts with this
           // and causes "Web page not available" or broken asset loading on first launch.
           if (window.Capacitor && window.Capacitor.isNativePlatform()) {
             // Unregister any previously registered service workers
             navigator.serviceWorker.getRegistrations().then(registrations => {
               registrations.forEach(reg => reg.unregister());
             });
             console.log('SW skipped: running on native platform');
             return;
           }
           navigator.serviceWorker.register('/sw.js').then(registration => {
             console.log('SW registered: ', registration);
           }).catch(registrationError => {
             console.log('SW registration failed: ', registrationError);
           });
         });
       }
    </script>
