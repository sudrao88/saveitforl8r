steps:
  # -------------------------------------------------------------------------
  # 0. Install Dependencies & Run Tests
  # -------------------------------------------------------------------------
  - name: 'node:20'
    id: 'install-and-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        echo "Running tests..."
        npm run test -- --run

  # -------------------------------------------------------------------------
  # 1. Build Server Image
  # -------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-server'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'
      - '-f'
      - 'server/Dockerfile'
      - 'server/'

  # -------------------------------------------------------------------------
  # 2. Push Server Image to Registry
  # -------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-server'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'

  # -------------------------------------------------------------------------
  # 3. Deploy Server to Cloud Run (asia-south1)
  # -------------------------------------------------------------------------
  # api.saveitforl8r.com reaches this service through the Firebase Hosting
  # rewrite in firebase.json (site: saveitforl8r-api). If the region or
  # service name changes here, change it there too.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-server-asia-south1'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'saveitforl8r-server'
      - '--image'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,VITE_GOOGLE_CLIENT_ID=VITE_GOOGLE_CLIENT_ID:latest'
      - '--update-env-vars=^##^ALLOWED_ORIGINS=${_APP_URL},${_SERVER_URL},capacitor://localhost,http://localhost,https://localhost'
      - '--port'
      - '8081'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--cpu'
      - '2'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '120'

  # -------------------------------------------------------------------------
  # 4. Build Client (static PWA → dist/)
  # -------------------------------------------------------------------------
  # node_modules is already in /workspace from step 0. Vite inlines the
  # VITE_* environment variables at build time.
  - name: 'node:20'
    id: 'build-client'
    # VITE_GOOGLE_MAPS_API_KEY is the browser key for the Maps JavaScript SDK.
    # It ships in the bundle (restricted by HTTP referrer); Secret Manager just
    # keeps it out of the repo and trigger config.
    secretEnv: ['VITE_GOOGLE_CLIENT_ID', 'VITE_GOOGLE_CLIENT_SECRET', 'VITE_GOOGLE_MAPS_API_KEY']
    env:
      - 'VITE_PROXY_URL=${_SERVER_URL}'
      - 'VITE_APP_URL=${_APP_URL}'
    entrypoint: 'npm'
    args: ['run', 'build']

  # -------------------------------------------------------------------------
  # 5. Deploy Client + API front door to Firebase Hosting
  # -------------------------------------------------------------------------
  # Publishes dist/ to the saveitforl8r site and the Cloud Run rewrite to the
  # saveitforl8r-api site (see firebase.json). Authenticates as the build
  # service account via Application Default Credentials.
  - name: 'node:20'
    id: 'deploy-hosting'
    entrypoint: 'npx'
    args:
      - '--yes'
      - 'firebase-tools@15.18.0'
      - 'deploy'
      - '--only'
      - 'hosting'
      - '--project'
      - '$PROJECT_ID'
      - '--non-interactive'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVER_URL: "https://api.saveitforl8r.com"
  _APP_URL: "https://saveitforl8r.com"

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/VITE_GOOGLE_CLIENT_ID/versions/latest
    env: 'VITE_GOOGLE_CLIENT_ID'
  - versionName: projects/$PROJECT_ID/secrets/VITE_GOOGLE_CLIENT_SECRET/versions/latest
    env: 'VITE_GOOGLE_CLIENT_SECRET'
  - versionName: projects/$PROJECT_ID/secrets/VITE_GOOGLE_MAPS_API_KEY/versions/latest
    env: 'VITE_GOOGLE_MAPS_API_KEY'

images:
- 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'
