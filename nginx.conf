# Combined host-routed nginx config (M6 — l8rgram split).
#
# One Cloud Run service serves BOTH apps. nginx selects the document root by
# `server_name`: requests to saveitforl8r.com get the saveitforl8r build,
# requests to l8rgram.com get the l8rgram build. Any other Host hits the
# catch-all default_server and gets a 404. The browser sees the two apps as
# separate origins (independent SWs, cookies, localStorage).
#
# .mjs MIME type is added to /etc/nginx/mime.types in Dockerfile.client
# (handles both application/javascript and text/javascript variants).
# IMPORTANT: never use a server-level `types {}` block here — it would replace
# ALL inherited MIME mappings and break .js/.css/.html content types.

# CORS origin — allow Capacitor native app origins for cross-origin fetches.
# Mapped once at the http level so both server blocks can reuse it.
map $http_origin $cors_origin {
    default "";
    "~*^(capacitor://localhost|ionic://localhost|http://localhost|https://localhost)$" $http_origin;
}

# -------------------------------------------------------------------------
# Catch-all: any unknown Host gets a 404 (no app leaks across hostnames).
# -------------------------------------------------------------------------
server {
    listen 8080 default_server;
    server_name _;
    return 404;
}

# -------------------------------------------------------------------------
# saveitforl8r
# -------------------------------------------------------------------------
server {
    listen 8080;
    server_name saveitforl8r.com www.saveitforl8r.com;

    root /usr/share/nginx/html/saveitforl8r;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://oauth2.googleapis.com https://accounts.google.com https://www.googleapis.com; img-src 'self' data: blob:; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;

    location / {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Disable caching for non-static assets (HTML, JSON) so updates are seen.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

        try_files $uri $uri.html $uri/ /index.html;
    }

    # Hashed static assets — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        try_files $uri =404;
    }
}

# -------------------------------------------------------------------------
# l8rgram
