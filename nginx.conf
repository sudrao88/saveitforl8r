server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Add .mjs MIME type — nginx's default mime.types only maps .js to
    # application/javascript.  Without this, .mjs files (like the PDF.js
    # worker) are served as application/octet-stream and browsers refuse
    # to load them as ES modules.
    types {
        application/javascript mjs;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://oauth2.googleapis.com https://accounts.google.com https://www.googleapis.com; img-src 'self' data: blob:; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;

    # CORS origin — allow Capacitor native app origins for cross-origin fetches
    set $cors_origin '';
    if ($http_origin ~* "^(capacitor://localhost|ionic://localhost|http://localhost|https://localhost)$") {
        set $cors_origin $http_origin;
    }

    location / {
        # CORS Headers
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Disable caching for non-static assets (HTML, JSON) to ensure updates are seen
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

        try_files $uri $uri/ /index.html;
    }

    # Static assets (hashed filenames) - Cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # CORS for assets (fonts need this)
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        
        try_files $uri =404;
    }
}
