steps:
  # -------------------------------------------------------------------------
  # 0. Install Dependencies & Run Tests
  # -------------------------------------------------------------------------
  - name: 'node:20'
    id: 'install-and-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        echo "Running tests across all workspaces..."
        # CI=true makes vitest (saveitforl8r + l8rgram) run once instead of
        # entering watch mode; server's `node --test` ignores it. We cannot use
        # `-- --run` here because that flag would also be forwarded to the
        # server's node --test and break it.
        CI=true npm test -ws --if-present

  # -------------------------------------------------------------------------
  # 1. Build Server Image
  # -------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-server'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'
      - '-f'
      - 'server/Dockerfile'
      - 'server/'

  # -------------------------------------------------------------------------
  # 2. Build Combined Client Image (saveitforl8r + l8rgram)
  # -------------------------------------------------------------------------
  # NOTE: Must use entrypoint bash so that secretEnv values (available as
  # environment variables) are shell-expanded into the docker build-args.
  # Without a shell, $$VAR in args is just an escape to literal $VAR which
  # docker passes through unexpanded.
  #
  # M6 (l8rgram split): this now builds the workspace-aware combined image from
  # the root Dockerfile.client, which builds BOTH apps and serves each from its
  # own nginx root (host-routed by server_name). There is deliberately NO
  # separate `l8rgram-client` Cloud Run service — the existing
  # `saveitforl8r-client` service hosts both apps (one warm-instance baseline;
  # renaming would force a domain-mapping migration). The build context is the
  # repo root so `npm ci` sees the root lockfile + every workspace manifest.
  #
  # l8rgram's client id/secret/hosted-url come from build substitutions (empty
  # by default — the app simply warns that sign-in is unconfigured until real
  # values are supplied via trigger substitutions; see
  # docs/l8rgram-setup-checklist.md).
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-client'
    secretEnv: ['VITE_GOOGLE_CLIENT_ID', 'VITE_GOOGLE_CLIENT_SECRET']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg "VITE_GOOGLE_CLIENT_ID=$$VITE_GOOGLE_CLIENT_ID" \
          --build-arg "VITE_GOOGLE_CLIENT_SECRET=$$VITE_GOOGLE_CLIENT_SECRET" \
          --build-arg "VITE_PROXY_URL=${_SERVER_URL}" \
          --build-arg "VITE_APP_URL=${_APP_URL}" \
          --build-arg "VITE_L8RGRAM_GOOGLE_CLIENT_ID=${_L8RGRAM_GOOGLE_CLIENT_ID}" \
          --build-arg "VITE_L8RGRAM_GOOGLE_CLIENT_SECRET=${_L8RGRAM_GOOGLE_CLIENT_SECRET}" \
          --build-arg "VITE_L8RGRAM_HOSTED_URL=${_L8RGRAM_APP_URL}" \
          -t "us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/client:latest" \
          -f Dockerfile.client \
          .

  # -------------------------------------------------------------------------
  # 3. Push Images to Registry
  # -------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-server'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-client'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/client:latest'

  # -------------------------------------------------------------------------
  # 4. Deploy to us-west1
  # -------------------------------------------------------------------------
  # Deploy Server
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-server-us-west1'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'saveitforl8r-server'
      - '--image'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,VITE_GOOGLE_CLIENT_ID=VITE_GOOGLE_CLIENT_ID:latest'
      - '--port'
      - '8081'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--cpu'
      - '2'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '120'

  # Deploy Client
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-client-us-west1'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'saveitforl8r-client'
      - '--image'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/client:latest'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '250'

  # -------------------------------------------------------------------------
  # 5. Deploy to asia-south1
  # -------------------------------------------------------------------------
  # Deploy Server
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-server-asia-south1'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'saveitforl8r-server'
      - '--image'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,VITE_GOOGLE_CLIENT_ID=VITE_GOOGLE_CLIENT_ID:latest'
      - '--port'
      - '8081'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--cpu'
      - '2'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '120'

  # Deploy Client
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-client-asia-south1'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'saveitforl8r-client'
      - '--image'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/client:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '250'

  # -------------------------------------------------------------------------
  # 6. Post-Deploy Configuration (ALLOWED_ORIGINS)
  # -------------------------------------------------------------------------
  # Update Server config in us-west1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-config-us-west1'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        CLIENT_URL=$$(gcloud run services describe saveitforl8r-client --region us-west1 --format="value(status.url)")
        ALLOWED_ORIGINS="https://saveitforl8r.com,https://api.saveitforl8r.com,capacitor://localhost,http://localhost,https://localhost"
        if [ -n "$$CLIENT_URL" ]; then
          ALLOWED_ORIGINS="$$ALLOWED_ORIGINS,$$CLIENT_URL"
        fi
        gcloud run services update saveitforl8r-server --region us-west1 --update-env-vars "^##^ALLOWED_ORIGINS=$$ALLOWED_ORIGINS"

  # Update Server config in asia-south1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-config-asia-south1'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        CLIENT_URL=$$(gcloud run services describe saveitforl8r-client --region asia-south1 --format="value(status.url)")
        ALLOWED_ORIGINS="https://saveitforl8r.com,https://api.saveitforl8r.com,capacitor://localhost,http://localhost,https://localhost"
        if [ -n "$$CLIENT_URL" ]; then
          ALLOWED_ORIGINS="$$ALLOWED_ORIGINS,$$CLIENT_URL"
        fi
        gcloud run services update saveitforl8r-server --region asia-south1 --update-env-vars "^##^ALLOWED_ORIGINS=$$ALLOWED_ORIGINS"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVER_URL: "https://api.saveitforl8r.com"
  _APP_URL: "https://saveitforl8r.com"
  # l8rgram is served by the SAME combined client image / Cloud Run service.
  # Supply real values via trigger substitutions before going live; empty
  # defaults keep the build green (l8rgram just warns sign-in is unconfigured).
  _L8RGRAM_APP_URL: "https://l8rgram.com"
  _L8RGRAM_GOOGLE_CLIENT_ID: ""
  _L8RGRAM_GOOGLE_CLIENT_SECRET: ""

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/VITE_GOOGLE_CLIENT_ID/versions/latest
    env: 'VITE_GOOGLE_CLIENT_ID'
  - versionName: projects/$PROJECT_ID/secrets/VITE_GOOGLE_CLIENT_SECRET/versions/latest
    env: 'VITE_GOOGLE_CLIENT_SECRET'

images:
- 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/server:latest'
- 'us-west1-docker.pkg.dev/$PROJECT_ID/saveitforl8r-repo/client:latest'
